<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tokyo Racing - Play Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ==================== UI ELEMENTS ==================== */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff00;
            pointer-events: none;
        }

        .speed-display {
            font-size: 48px;
            font-weight: bold;
            color: #ff0080;
            text-shadow: 0 0 20px #ff0080;
            margin-bottom: 10px;
        }

        .rpm-display {
            font-size: 16px;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }

        .hud-right {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #00d4ff;
            font-size: 14px;
            text-shadow: 0 0 10px #00d4ff;
            pointer-events: none;
        }

        .minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            border: 2px solid #00d4ff;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            pointer-events: none;
        }

        .minimap-content {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .minimap-player {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ff00;
        }

        /* ==================== MENU ==================== */
        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 20, 40, 0.95), rgba(0, 40, 80, 0.95));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #00d4ff;
            text-shadow: 0 0 20px #00d4ff;
            font-family: 'Arial', sans-serif;
            pointer-events: auto;
        }

        .menu.hidden {
            display: none;
        }

        .menu h1 {
            font-size: 64px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #00d4ff; }
            50% { text-shadow: 0 0 30px #00d4ff, 0 0 50px #ff006e; }
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .menu-btn {
            padding: 15px 50px;
            font-size: 18px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        /* ==================== PAUSE MENU ==================== */
        .pause-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(0, 20, 40, 0.98), rgba(0, 40, 80, 0.98));
            padding: 40px;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            text-align: center;
            z-index: 999;
            display: none;
            color: #00d4ff;
            pointer-events: auto;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
        }

        .pause-menu.show {
            display: block;
        }

        .pause-menu h2 {
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #00d4ff;
        }

        .pause-menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pause-btn {
            padding: 10px 30px;
            font-size: 16px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 2px solid #00d4ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pause-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateX(5px);
        }

        /* ==================== RACE INFO ==================== */
        .race-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00d4ff;
            font-size: 14px;
            text-shadow: 0 0 10px #00d4ff;
            pointer-events: none;
        }

        .race-timer {
            font-size: 24px;
            font-weight: bold;
            color: #ff0080;
            text-shadow: 0 0 15px #ff0080;
            margin-bottom: 10px;
        }

        /* ==================== CONTROLS INFO ==================== */
        .controls-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00d4ff;
            font-size: 12px;
            text-shadow: 0 0 10px #00d4ff;
            pointer-events: none;
            text-align: center;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .hud-top {
                font-size: 12px;
            }
            
            .speed-display {
                font-size: 36px;
            }
            
            .minimap {
                width: 120px;
                height: 120px;
            }
            
            .menu h1 {
                font-size: 42px;
            }
            
            .menu-btn {
                padding: 12px 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="canvas"></canvas>
    
    <!-- ==================== MAIN MENU ==================== -->
    <div id="mainMenu" class="menu">
        <h1>🏎️ TOKYO RACING</h1>
        <p style="font-size: 18px; margin-bottom: 40px; color: #a0a0a0;">Open-World Racing Experience</p>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="startRace()">▶️ START RACE</button>
            <button class="menu-btn" onclick="startFreeRoam()">🛣️ FREE ROAM</button>
            <button class="menu-btn" onclick="showSettings()">⚙️ SETTINGS</button>
            <button class="menu-btn" onclick="showCredits()">ℹ️ ABOUT</button>
        </div>
    </div>

    <!-- ==================== PAUSE MENU ==================== -->
    <div id="pauseMenu" class="pause-menu">
        <h2>⏸️ PAUSED</h2>
        <div class="pause-menu-buttons">
            <button class="pause-btn" onclick="resumeGame()">▶️ RESUME</button>
            <button class="pause-btn" onclick="returnToMenu()">🏠 MAIN MENU</button>
            <button class="pause-btn" onclick="showSettings()">⚙️ SETTINGS</button>
        </div>
    </div>

    <!-- ==================== HUD ==================== -->
    <div id="hud" class="hud">
        <div class="hud-top">
            <div class="speed-display" id="speedDisplay">0 km/h</div>
            <div class="rpm-display" id="rpmDisplay">RPM: 0</div>
            <div style="margin-top: 10px; font-size: 12px; color: #00d4ff;">GEAR: <span id="gearDisplay">P</span></div>
        </div>

        <div class="hud-right">
            <div id="timeDisplay">TIME: 00:00</div>
            <div style="margin-top: 10px;" id="distanceDisplay">DISTANCE: 0m</div>
            <div style="margin-top: 10px;" id="fpsDisplay">FPS: 60</div>
        </div>

        <div class="minimap">
            <div class="minimap-content">
                <div class="minimap-player"></div>
            </div>
        </div>

        <div class="race-info">
            <div id="positionDisplay">POSITION: --</div>
            <div class="race-timer" id="lapTimer">LAP: 00:00</div>
        </div>

        <div class="controls-info">
            <div id="controlsText">ARROW KEYS / WASD: Drive | SPACE: Brake | P: Pause | ESC: Menu</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // ==================== GAME STATE ==================== 
    let gameState = {
        isRunning: false,
        isPaused: false,
        gameMode: 'menu', // menu, race, freeRoam
        speed: 0,
        rpm: 0,
        gear: 'P',
        position: { x: 0, y: 0, z: 0 },
        rotation: 0,
        lapTime: 0,
        totalTime: 0,
        distance: 0,
        fps: 60,
        throttle: 0,
        steering: 0,
        brake: 0,
    };

    // ==================== THREE.JS SETUP ==================== 
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 2000, 5000);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(0, 10, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    // ==================== LIGHTING ==================== 
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(100, 100, 50);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    // ==================== WORLD CREATION ==================== 
    function createWorld() {
        // Ground
        const groundGeometry = new THREE.PlaneGeometry(5000, 5000);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Road
        const roadGeometry = new THREE.PlaneGeometry(200, 3000);
        const roadMaterial = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
        const road = new THREE.Mesh(roadGeometry, roadMaterial);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        road.receiveShadow = true;
        scene.add(road);

        // Road markings
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 4;
        for (let i = 0; i < 512; i += 50) {
            ctx.beginPath();
            ctx.moveTo(256, i);
            ctx.lineTo(256, i + 25);
            ctx.stroke();
        }
        
        const texture = new THREE.CanvasTexture(canvas);
        texture.repeat.y = 6;
        texture.wrapT = THREE.RepeatWrapping;
        
        const roadMarkingsGeometry = new THREE.PlaneGeometry(200, 3000);
        const roadMarkingsMaterial = new THREE.MeshBasicMaterial({ map: texture });
        const roadMarkings = new THREE.Mesh(roadMarkingsGeometry, roadMarkingsMaterial);
        roadMarkings.rotation.x = -Math.PI / 2;
        roadMarkings.position.y = 0.02;
        scene.add(roadMarkings);

        // Buildings
        for (let i = 0; i < 20; i++) {
            const buildingWidth = Math.random() * 50 + 30;
            const buildingHeight = Math.random() * 150 + 50;
            const buildingDepth = Math.random() * 50 + 30;
            
            const buildingGeometry = new THREE.BoxGeometry(buildingWidth, buildingHeight, buildingDepth);
            const buildingMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(Math.random(), 0.3, 0.3),
                metalness: 0.3,
                roughness: 0.7
            });
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.set(
                (Math.random() - 0.5) * 1000,
                buildingHeight / 2,
                -1000 + Math.random() * 2000
            );
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
        }

        // Neon lights
        for (let i = 0; i < 10; i++) {
            const lightColor = [0xff006e, 0x00d4ff, 0x00ff00][Math.floor(Math.random() * 3)];
            const neonLight = new THREE.PointLight(lightColor, 1, 300);
            neonLight.position.set(
                (Math.random() - 0.5) * 1000,
                Math.random() * 100 + 50,
                -1000 + Math.random() * 2000
            );
            scene.add(neonLight);
        }
    }

    createWorld();

    // ==================== VEHICLE CREATION ==================== 
    let vehicle;

    function createVehicle() {
        const vehicleGroup = new THREE.Group();
        
        // Car body
        const bodyGeometry = new THREE.BoxGeometry(2, 1.5, 4.5);
        const bodyMaterial = new THREE.MeshStandardMaterial({
            color: 0xff0000,
            metalness: 0.8,
            roughness: 0.2
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 0.75;
        body.castShadow = true;
        body.receiveShadow = true;
        vehicleGroup.add(body);

        // Wheels
        const wheels = [];
        const wheelPositions = [
            [-1, 0.4, 1.2],
            [1, 0.4, 1.2],
            [-1, 0.4, -1.2],
            [1, 0.4, -1.2]
        ];

        wheelPositions.forEach(pos => {
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMaterial = new THREE.MeshStandardMaterial({
                color: 0x222222,
                metalness: 0.6,
                roughness: 0.5
            });
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos[0], pos[1], pos[2]);
            wheel.castShadow = true;
            wheel.receiveShadow = true;
            vehicleGroup.add(wheel);
            wheels.push(wheel);
        });

        // Windows
        const windowGeometry = new THREE.BoxGeometry(1.8, 0.8, 1.5);
        const windowMaterial = new THREE.MeshStandardMaterial({
            color: 0x0099ff,
            metalness: 0.9,
            roughness: 0.1,
            transparent: true,
            opacity: 0.5
        });
        const window1 = new THREE.Mesh(windowGeometry, windowMaterial);
        window1.position.set(0, 1.3, 0.5);
        vehicleGroup.add(window1);

        vehicleGroup.position.set(0, 0, 0);
        vehicleGroup.wheels = wheels;
        scene.add(vehicleGroup);
        return vehicleGroup;
    }

    vehicle = createVehicle();

    // ==================== INPUT HANDLING ==================== 
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (e.key === 'p' || e.key === 'P') togglePause();
        if (e.key === 'Escape') returnToMenu();
    });

    window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
    });

    function handleInput() {
        gameState.throttle = 0;
        gameState.brake = 0;
        gameState.steering = 0;

        if (keys['w'] || keys['W'] || keys['ArrowUp']) gameState.throttle = 1;
        if (keys['s'] || keys['S'] || keys['ArrowDown']) gameState.brake = 1;
        if (keys['a'] || keys['A'] || keys['ArrowLeft']) gameState.steering = -1;
        if (keys['d'] || keys['D'] || keys['ArrowRight']) gameState.steering = 1;
        if (keys[' ']) gameState.brake = 1;
    }

    // ==================== PHYSICS ==================== 
    function updatePhysics() {
        // Acceleration
        const maxSpeed = 300; // km/h
        const acceleration = 2;
        const friction = 0.98;

        if (gameState.throttle > 0) {
            gameState.speed = Math.min(gameState.speed + acceleration, maxSpeed);
        } else if (gameState.brake > 0) {
            gameState.speed = Math.max(gameState.speed - acceleration * 2, 0);
        } else {
            gameState.speed *= friction;
        }

        // Steering
        const maxRotation = 0.05;
        if (gameState.steering !== 0) {
            vehicle.rotation.y += gameState.steering * maxRotation;
        }

        // Movement
        const moveSpeed = gameState.speed / 3.6 * 0.016; // Convert to m/s
        vehicle.position.x += Math.sin(vehicle.rotation.y) * moveSpeed;
        vehicle.position.z += Math.cos(vehicle.rotation.y) * moveSpeed;

        // Distance tracking
        gameState.distance += moveSpeed;

        // RPM calculation
        gameState.rpm = (gameState.speed / maxSpeed) * 7500;

        // Gear calculation
        if (gameState.speed < 5) {
            gameState.gear = 'P';
        } else if (gameState.speed < 50) {
            gameState.gear = '1';
        } else if (gameState.speed < 100) {
            gameState.gear = '2';
        } else if (gameState.speed < 150) {
            gameState.gear = '3';
        } else if (gameState.speed < 200) {
            gameState.gear = '4';
        } else {
            gameState.gear = '5';
        }

        // Wheel rotation
        vehicle.wheels.forEach(wheel => {
            wheel.rotation.x += gameState.speed / 50;
        });

        // Camera follow
        const cameraDistance = 30;
        const cameraHeight = 10;
        camera.position.x = vehicle.position.x - Math.sin(vehicle.rotation.y) * cameraDistance;
        camera.position.y = vehicle.position.y + cameraHeight;
        camera.position.z = vehicle.position.z - Math.cos(vehicle.rotation.y) * cameraDistance;
        camera.lookAt(vehicle.position.x, vehicle.position.y + 2, vehicle.position.z);
    }

    // ==================== UI UPDATE ==================== 
    let frameCount = 0;
    let lastFrameTime = Date.now();

    function updateUI() {
        // Speed display
        document.getElementById('speedDisplay').textContent = Math.round(gameState.speed) + ' km/h';
        document.getElementById('rpmDisplay').textContent = 'RPM: ' + Math.round(gameState.rpm);
        document.getElementById('gearDisplay').textContent = gameState.gear;

        // Time display
        const minutes = Math.floor(gameState.totalTime / 60);
        const seconds = Math.floor(gameState.totalTime % 60);
        document.getElementById('timeDisplay').textContent = 'TIME: ' + 
            String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

        // Distance display
        document.getElementById('distanceDisplay').textContent = 'DISTANCE: ' + Math.round(gameState.distance) + 'm';

        // Lap timer
        const lapMinutes = Math.floor(gameState.lapTime / 60);
        const lapSeconds = Math.floor(gameState.lapTime % 60);
        document.getElementById('lapTimer').textContent = 'LAP: ' + 
            String(lapMinutes).padStart(2, '0') + ':' + String(lapSeconds).padStart(2, '0');

        // FPS display
        frameCount++;
        const now = Date.now();
        if (now - lastFrameTime >= 1000) {
            gameState.fps = frameCount;
            document.getElementById('fpsDisplay').textContent = 'FPS: ' + frameCount;
            frameCount = 0;
            lastFrameTime = now;
        }
    }

    // ==================== GAME LOOP ==================== 
    function gameLoop() {
        requestAnimationFrame(gameLoop);

        if (gameState.isRunning && !gameState.isPaused) {
            handleInput();
            updatePhysics();
            gameState.totalTime += 0.016;
            gameState.lapTime += 0.016;
        }

        updateUI();
        renderer.render(scene, camera);
    }

    // ==================== MENU FUNCTIONS ==================== 
    function startRace() {
        document.getElementById('mainMenu').classList.add('hidden');
        gameState.isRunning = true;
        gameState.gameMode = 'race';
        gameState.speed = 0;
        gameState.totalTime = 0;
        gameState.lapTime = 0;
        gameState.distance = 0;
        vehicle.position.set(0, 0, 0);
        document.getElementById('controlsText').textContent = 'ARROW KEYS / WASD: Drive | SPACE: Brake | P: Pause | ESC: Menu';
    }

    function startFreeRoam() {
        document.getElementById('mainMenu').classList.add('hidden');
        gameState.isRunning = true;
        gameState.gameMode = 'freeRoam';
        gameState.speed = 0;
        gameState.totalTime = 0;
        gameState.lapTime = 0;
        gameState.distance = 0;
        vehicle.position.set(0, 0, 0);
        document.getElementById('controlsText').textContent = 'FREE ROAM: Explore Tokyo | ARROW KEYS / WASD: Drive | SPACE: Brake | P: Pause | ESC: Menu';
    }

    function togglePause() {
        if (!gameState.isRunning) return;
        gameState.isPaused = !gameState.isPaused;
        const pauseMenu = document.getElementById('pauseMenu');
        if (gameState.isPaused) {
            pauseMenu.classList.add('show');
        } else {
            pauseMenu.classList.remove('show');
        }
    }

    function resumeGame() {
        gameState.isPaused = false;
        document.getElementById('pauseMenu').classList.remove('show');
    }

    function returnToMenu() {
        gameState.isRunning = false;
        gameState.isPaused = false;
        document.getElementById('mainMenu').classList.remove('hidden');
        document.getElementById('pauseMenu').classList.remove('show');
        gameState.speed = 0;
        vehicle.position.set(0, 0, 0);
        vehicle.rotation.set(0, 0, 0);
    }

    function showSettings() {
        alert('⚙️ SETTINGS\n\n🔊 Volume: 100%\n🎮 Controls: Keyboard\n📊 Graphics: Ultra\n\nSettings will be available in future updates!');
    }

    function showCredits() {
        alert('ℹ️ ABOUT Tokyo Racing\n\nA web-based open-world racing game prototype.\n\nDeveloped for mobile and desktop platforms.\n\n🎮 Engine: Three.js\n💻 Language: JavaScript\n🎨 Design: Cyberpunk Neon\n\n© 2024 Tokyo Racing. All rights reserved.');
    }

    // ==================== RESPONSIVE ==================== 
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================== START GAME ==================== 
    gameLoop();
</script>

</body>
</html>
