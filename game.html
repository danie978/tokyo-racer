<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tokyo Racing - Play Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(180deg, #0a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* ==================== UI ELEMENTS ==================== */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff00;
            pointer-events: none;
        }

        .speed-display {
            font-size: 48px;
            font-weight: bold;
            color: #ff0080;
            text-shadow: 0 0 20px #ff0080, 0 0 40px #ff0080;
            margin-bottom: 10px;
        }

        .rpm-display {
            font-size: 16px;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }

        .hud-right {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #00d4ff;
            font-size: 14px;
            text-shadow: 0 0 10px #00d4ff;
            pointer-events: none;
        }

        .minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 180px;
            border: 3px solid #00d4ff;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5), inset 0 0 20px rgba(0, 212, 255, 0.1);
            pointer-events: none;
        }

        .minimap-content {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .minimap-player {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #00ff00;
        }

        /* ==================== MENU ==================== */
        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 26, 46, 0.98), rgba(22, 33, 62, 0.98));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #00d4ff;
            text-shadow: 0 0 20px #00d4ff;
            font-family: 'Arial', sans-serif;
            pointer-events: auto;
        }

        .menu.hidden {
            display: none;
        }

        .menu h1 {
            font-size: 80px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #ff006e, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
            font-weight: bold;
            letter-spacing: 3px;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px #00d4ff); }
            50% { filter: drop-shadow(0 0 30px #00d4ff) drop-shadow(0 0 50px #ff006e); }
        }

        .menu-subtitle {
            font-size: 18px;
            color: #ff006e;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #ff006e;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .menu-btn {
            padding: 15px 60px;
            font-size: 20px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .menu-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.8);
            background: linear-gradient(135deg, #00ffff, #00d4ff);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        /* ==================== PAUSE MENU ==================== */
        .pause-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(10, 26, 46, 0.98), rgba(22, 33, 62, 0.98));
            padding: 50px;
            border: 3px solid #00d4ff;
            border-radius: 12px;
            text-align: center;
            z-index: 999;
            display: none;
            color: #00d4ff;
            pointer-events: auto;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.5);
        }

        .pause-menu.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .pause-menu h2 {
            font-size: 40px;
            margin-bottom: 30px;
            color: #ff006e;
        }

        .pause-menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pause-btn {
            padding: 12px 40px;
            font-size: 16px;
            background: linear-gradient(135deg, #ff006e, #ff0099);
            color: #fff;
            border: 2px solid #ff006e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        .pause-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.6);
        }

        .pause-btn:active {
            transform: scale(0.95);
        }

        /* ==================== MOBILE CONTROLS ==================== */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: none;
            gap: 10px;
            z-index: 100;
        }

        .mobile-controls.active {
            display: flex;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 212, 255, 0.3);
            border: 2px solid #00d4ff;
            border-radius: 50%;
            color: #00d4ff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .control-btn:active {
            background: rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
        }

        .stats-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00d4ff;
            padding: 15px;
            border-radius: 8px;
            color: #00d4ff;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #00d4ff;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        
        <div class="hud">
            <div class="hud-top">
                <div class="speed-display" id="speedDisplay">0 km/h</div>
                <div class="rpm-display" id="rpmDisplay">RPM: 0</div>
            </div>
            <div class="hud-right" id="hudRight">
                <div>Position: <span id="posX">0</span>, <span id="posY">0</span></div>
                <div>Direction: <span id="dirDisplay">0</span>°</div>
                <div>Time: <span id="timeDisplay">00:00</span></div>
            </div>
            <div class="minimap">
                <div class="minimap-content" id="minimapContent">
                    <div class="minimap-player"></div>
                </div>
            </div>
        </div>

        <div class="menu" id="menu">
            <h1>TOKYO RACER</h1>
            <div class="menu-subtitle">🏎️ Open-World Racing Game 🌆</div>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="startGame()">▶ START GAME</button>
                <button class="menu-btn" onclick="showSettings()">⚙ SETTINGS</button>
                <button class="menu-btn" onclick="showControls()">🎮 CONTROLS</button>
            </div>
        </div>

        <div class="pause-menu" id="pauseMenu">
            <h2>⏸ PAUSED</h2>
            <div class="pause-menu-buttons">
                <button class="pause-btn" onclick="resumeGame()">RESUME</button>
                <button class="pause-btn" onclick="goMainMenu()">MAIN MENU</button>
            </div>
        </div>

        <div class="mobile-controls" id="mobileControls">
            <button class="control-btn" id="upBtn">⬆</button>
            <button class="control-btn" id="leftBtn">⬅</button>
            <button class="control-btn" id="downBtn">⬇</button>
            <button class="control-btn" id="rightBtn">➡</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ==================== GAME STATE ====================
        let gameState = {
            running: false,
            paused: false,
            startTime: 0,
            elapsedTime: 0
        };

        // ==================== PLAYER ====================
        let player = {
            x: 400,
            y: 300,
            width: 25,
            height: 40,
            vx: 0,
            vy: 0,
            angle: 0,
            speed: 0,
            maxSpeed: 15,
            acceleration: 0.3,
            friction: 0.92,
            rotation: 0,
            rpm: 0
        };

        // ==================== INPUT HANDLING ====================
        let keys = {};
        
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (gameState.running && !gameState.paused) {
                    pauseGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // ==================== MAP & BUILDINGS ====================
        const mapWidth = 2000;
        const mapHeight = 1500;
        const buildings = [
            { x: 100, y: 100, w: 120, h: 80, type: 'skyscraper', color: '#ff3366' },
            { x: 300, y: 150, w: 100, h: 100, type: 'office', color: '#00d4ff' },
            { x: 550, y: 80, w: 150, h: 120, type: 'mall', color: '#ffaa00' },
            { x: 900, y: 100, w: 180, h: 150, type: 'tower', color: '#ff6600' },
            { x: 1200, y: 200, w: 140, h: 110, type: 'building', color: '#00ff88' },
            { x: 150, y: 400, w: 130, h: 140, type: 'hotel', color: '#ff0099' },
            { x: 500, y: 500, w: 160, h: 100, type: 'plaza', color: '#00ffff' },
            { x: 1000, y: 600, w: 120, h: 120, type: 'garage', color: '#ff6b6b' },
            { x: 300, y: 1000, w: 150, h: 130, type: 'station', color: '#ffff00' },
            { x: 1300, y: 800, w: 140, h: 100, type: 'temple', color: '#ff3366' },
            { x: 600, y: 1100, w: 180, h: 140, type: 'market', color: '#00ff00' },
            { x: 1500, y: 200, w: 160, h: 120, type: 'factory', color: '#888888' },
            { x: 1800, y: 900, w: 170, h: 140, type: 'arena', color: '#ff00ff' },
        ];

        // ==================== DRAWING FUNCTIONS ====================
        function drawBuilding(building, offsetX, offsetY) {
            const x = building.x - offsetX;
            const y = building.y - offsetY;
            
            // Main body with gradient
            const gradient = ctx.createLinearGradient(x, y, x, y + building.h);
            gradient.addColorStop(0, building.color);
            gradient.addColorStop(0.5, adjustBrightness(building.color, -20));
            gradient.addColorStop(1, adjustBrightness(building.color, -40));
            
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, building.w, building.h);
            
            // Neon outline
            ctx.strokeStyle = building.color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.8;
            ctx.strokeRect(x, y, building.w, building.h);
            ctx.globalAlpha = 1;
            
            // Windows
            const windowSize = 8;
            const gap = 2;
            ctx.fillStyle = 'rgba(255, 255, 0, 0.6)';
            for (let wy = y + 10; wy < y + building.h - 10; wy += windowSize + gap) {
                for (let wx = x + 10; wx < x + building.w - 10; wx += windowSize + gap) {
                    ctx.fillRect(wx, wy, windowSize, windowSize);
                    ctx.strokeStyle = 'rgba(255, 200, 0, 0.4)';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(wx, wy, windowSize, windowSize);
                }
            }
        }

        function drawRoad(x1, y1, x2, y2, offsetX, offsetY, width = 60) {
            const sx1 = x1 - offsetX;
            const sy1 = y1 - offsetY;
            const sx2 = x2 - offsetX;
            const sy2 = y2 - offsetY;
            
            // Main road
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(sx1, sy1);
            ctx.lineTo(sx2, sy2);
            ctx.stroke();
            
            // Road markings
            const len = Math.hypot(sx2 - sx1, sy2 - sy1);
            const angle = Math.atan2(sy2 - sy1, sx2 - sx1);
            const dx = Math.cos(angle);
            const dy = Math.sin(angle);
            
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 10]);
            ctx.beginPath();
            ctx.moveTo(sx1, sy1);
            ctx.lineTo(sx2, sy2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPlayer(offsetX, offsetY) {
            const screenX = player.x - offsetX;
            const screenY = player.y - offsetY;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(player.angle);
            
            // Car body - sleek sports car design
            const gradient = ctx.createLinearGradient(0, -player.height/2, 0, player.height/2);
            gradient.addColorStop(0, '#ff1744');
            gradient.addColorStop(0.5, '#ff0000');
            gradient.addColorStop(1, '#cc0000');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(player.width/2, -player.height/3);
            ctx.lineTo(player.width/2, player.height/3);
            ctx.lineTo(0, player.height/2);
            ctx.lineTo(-player.width/2, player.height/3);
            ctx.lineTo(-player.width/2, -player.height/3);
            ctx.closePath();
            ctx.fill();
            
            // Car windows
            ctx.fillStyle = 'rgba(100, 150, 255, 0.6)';
            ctx.fillRect(-player.width/3, -player.height/3, 2*player.width/3, player.height/6);
            
            // Neon glow
            ctx.strokeStyle = 'rgba(255, 100, 0, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Headlights
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(player.width/2 - 3, -player.width/4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.width/2 - 3, player.width/4, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        function adjustBrightness(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 +
                (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255))
                .toString(16).slice(1);
        }

        function drawMinimap() {
            const minimap = document.getElementById('minimapContent');
            const minimapWidth = minimap.offsetWidth;
            const minimapHeight = minimap.offsetHeight;
            
            const scaleX = minimapWidth / mapWidth;
            const scaleY = minimapHeight / mapHeight;
            
            // Draw buildings on minimap
            const temp = ctx;
            ctx = document.createElement('canvas').getContext('2d');
            
            // This would be better done with a separate canvas, but for now update player position
            const minimapPlayer = minimap.querySelector('.minimap-player');
            minimapPlayer.style.left = (player.x / mapWidth * 100) + '%';
            minimapPlayer.style.top = (player.y / mapHeight * 100) + '%';
        }

        // ==================== UPDATE FUNCTIONS ====================
        function updatePlayer() {
            let accel = 0;
            
            if (keys['w'] || keys['arrowup']) accel = player.acceleration;
            if (keys['s'] || keys['arrowdown']) accel = -player.acceleration * 0.5;
            
            player.speed += accel;
            player.speed = Math.max(-player.maxSpeed * 0.5, Math.min(player.speed, player.maxSpeed));
            player.speed *= player.friction;
            
            if (keys['a'] || keys['arrowleft']) player.angle -= 0.15;
            if (keys['d'] || keys['arrowright']) player.angle += 0.15;
            
            player.vx = Math.cos(player.angle) * player.speed;
            player.vy = Math.sin(player.angle) * player.speed;
            
            player.x += player.vx;
            player.y += player.vy;
            
            // Boundaries
            player.x = Math.max(0, Math.min(player.x, mapWidth));
            player.y = Math.max(0, Math.min(player.y, mapHeight));
            
            player.rpm = Math.abs(player.speed) * 200;
        }

        function checkCollisions() {
            for (let building of buildings) {
                if (player.x - player.width/2 < building.x + building.w &&
                    player.x + player.width/2 > building.x &&
                    player.y - player.height/2 < building.y + building.h &&
                    player.y + player.height/2 > building.y) {
                    
                    player.speed = 0;
                    const pushX = player.x < building.x + building.w/2 ? -10 : 10;
                    const pushY = player.y < building.y + building.h/2 ? -10 : 10;
                    player.x += pushX;
                    player.y += pushY;
                }
            }
        }

        // ==================== RENDER ====================
        function render() {
            const offsetX = player.x - canvas.width / 3;
            const offsetY = player.y - canvas.height / 2;
            
            // Sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a1a2e');
            gradient.addColorStop(0.5, '#16213e');
            gradient.addColorStop(1, '#0f3460');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid for Tokyo streets
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.15)';
            ctx.lineWidth = 1;
            const gridSize = 100;
            for (let x = -gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = -gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw roads
            drawRoad(0, 250, mapWidth, 250, offsetX, offsetY, 70);
            drawRoad(500, 0, 500, mapHeight, offsetX, offsetY, 70);
            drawRoad(1000, 50, 1000, mapHeight, offsetX, offsetY, 60);
            drawRoad(100, 700, mapWidth - 100, 700, offsetX, offsetY, 65);
            drawRoad(200, 0, 200, mapHeight, offsetX, offsetY, 55);
            
            // Draw buildings
            for (let building of buildings) {
                drawBuilding(building, offsetX, offsetY);
            }
            
            // Draw player
            drawPlayer(offsetX, offsetY);
            
            // Update HUD
            updateHUD(offsetX, offsetY);
        }

        function updateHUD(offsetX, offsetY) {
            document.getElementById('speedDisplay').textContent = Math.round(Math.abs(player.speed * 10)) + ' km/h';
            document.getElementById('rpmDisplay').textContent = 'RPM: ' + Math.round(player.rpm);
            document.getElementById('posX').textContent = Math.round(player.x);
            document.getElementById('posY').textContent = Math.round(player.y);
            document.getElementById('dirDisplay').textContent = Math.round(player.angle * 180 / Math.PI);
            
            if (gameState.running) {
                gameState.elapsedTime = Math.floor((Date.now() - gameState.startTime) / 1000);
                const minutes = Math.floor(gameState.elapsedTime / 60);
                const seconds = gameState.elapsedTime % 60;
                document.getElementById('timeDisplay').textContent = 
                    (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
            }
        }

        // ==================== GAME LOOP ====================
        function gameLoop() {
            if (gameState.running && !gameState.paused) {
                updatePlayer();
                checkCollisions();
                render();
            }
            requestAnimationFrame(gameLoop);
        }

        // ==================== MENU FUNCTIONS ====================
        function startGame() {
            document.getElementById('menu').classList.add('hidden');
            gameState.running = true;
            gameState.paused = false;
            gameState.startTime = Date.now();
            gameState.elapsedTime = 0;
        }

        function pauseGame() {
            gameState.paused = true;
            document.getElementById('pauseMenu').classList.add('show');
        }

        function resumeGame() {
            gameState.paused = false;
            document.getElementById('pauseMenu').classList.remove('show');
            gameState.startTime = Date.now() - gameState.elapsedTime * 1000;
        }

        function goMainMenu() {
            gameState.running = false;
            gameState.paused = false;
            player.x = 400;
            player.y = 300;
            player.speed = 0;
            player.vx = 0;
            player.vy = 0;
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('pauseMenu').classList.remove('show');
        }

        function showSettings() {
            alert('⚙ Settings\n\n- Adjust graphics quality\n- Change difficulty\n- Control sensitivity');
        }

        function showControls() {
            alert('🎮 Controls\n\nW/↑ - Accelerate\nS/↓ - Brake\nA/← - Turn Left\nD/→ - Turn Right\nSPACE - Pause\n\nEnjoy Racing! 🏎️');
        }

        // ==================== START ====================
        gameLoop();
    </script>
</body>
</html>
